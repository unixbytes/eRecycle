[build-system]
requires = ["setuptools>=68", "wheel", "flask>=3.0", "flask-sqlalchemy>=3.1", "flask-wtf>=1.2", "wtforms>=3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "erecycle"
version = "0.1.0"
description = "Electronic recycling management system"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.3.0",
    "flask>=3.0",
    "flask-mail>=0.10.0",
    "flask-sqlalchemy>=3.1",
    "flask-wtf>=1.2",
    "msal>=1.37.0",
    "qrcode[pil]>=8.2",
    "requests>=2.34.2",
    "wtforms>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
